# Netlify 部署配置
# 静态站点部署

[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 静态生成，不需要 Edge Functions
# Astro 的 output: "static" 会生成纯静态文件

# SPA 路由支持（如果需要）
# 对于静态生成的站点，所有路由都已预渲染为 HTML
# 不需要额外的重定向规则

# 缓存控制
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# PWA 相关文件
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
