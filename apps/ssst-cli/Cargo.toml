[package]
name = "ssst-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "BLE (and future Serial) debugging TUI CLI"

[dependencies]
btleplug = "0.11"
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
